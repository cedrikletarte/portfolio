variables:
  IMAGE_TAGGED_NAME: 'portfolio-app:latest'
  # Docker configuration for socket connection
  DOCKER_HOST: unix:///var/run/docker.sock
  DOCKER_TLS_CERTDIR: ''
  DOCKER_DRIVER: overlay2

stages:
  - test
  - build
  - deploy

test-job:
  stage: test
  image: node:lts-alpine
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  script:
    - npm ci --cache .npm --prefer-offline
    - npx tsc --noEmit -p tsconfig.json
    - npm test
  # No branch restriction: runs on every push, not just master, so feature
  # branches get feedback before merging. build-job only runs on master, but
  # since it's in a later stage it also only starts after test-job passes.

build-job:
  stage: build
  image: docker:latest
  before_script:
    # download docker file from docker-configs repo
    - wget -O /opt/Dockerfile --header "PRIVATE-TOKEN:${GITLAB_READ_TOKEN}" ${CI_API_V4_URL}/projects/17/repository/files/dockerfiles%2Fportfolio%2FDockerfile/raw\?ref=main
  script:
    - docker build -f /opt/Dockerfile -t "${IMAGE_TAGGED_NAME}" --no-cache --network=host .
  rules:
    - if: $CI_COMMIT_BRANCH == "master" && $CI_PROJECT_ID == "1"

deploy-job:
  stage: deploy
  image: docker/compose:latest
  needs: [build-job]
  before_script:
    # download docker-compose file from docker-configs repo
    - wget -O /opt/docker-compose.yml --header "PRIVATE-TOKEN:${GITLAB_READ_TOKEN}" ${CI_API_V4_URL}/projects/17/repository/files/deployments%2Fportfolio%2Fdocker-compose.yml/raw\?ref=main
  script:
    - docker-compose -f /opt/docker-compose.yml down || true
    - docker-compose -f /opt/docker-compose.yml up -d --build
  rules:
    - if: $CI_COMMIT_BRANCH == "master" && $CI_PROJECT_ID == "1"
