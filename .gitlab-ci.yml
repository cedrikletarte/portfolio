variables:
  IMAGE_TAGGED_NAME: 'portfolio-app:latest'
  # Docker configuration for socket connection
  DOCKER_HOST: unix:///var/run/docker.sock
  DOCKER_TLS_CERTDIR: ''
  DOCKER_DRIVER: overlay2

stages:
  - test
  - build
  - scan
  - deploy

test-job:
  stage: test
  image: node:lts-alpine
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  script:
    - npm ci --cache .npm --prefer-offline
    - npx tsc --noEmit -p tsconfig.json
    - npm test
  # No branch restriction: runs on every push, not just master, so feature
  # branches get feedback before merging. build-job only runs on master, but
  # since it's in a later stage it also only starts after test-job passes.

build-job:
  stage: build
  image: docker:latest
  before_script:
    # download docker file from docker-configs repo
    - wget -O /opt/Dockerfile --header "PRIVATE-TOKEN:${GITLAB_READ_TOKEN}" ${CI_API_V4_URL}/projects/19/repository/files/dockerfiles%2Fportfolio%2FDockerfile/raw\?ref=main
  script:
    - docker build -f /opt/Dockerfile -t "${IMAGE_TAGGED_NAME}" --no-cache --network=host .
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == "master" && $CI_PROJECT_ID == "1"

deploy-job:
  stage: deploy
  image: docker:latest
  needs: [build-job]
  before_script:
    # download docker-compose file from docker-configs repo
    - wget -O /opt/docker-compose.yml --header "PRIVATE-TOKEN:${GITLAB_READ_TOKEN}" ${CI_API_V4_URL}/projects/19/repository/files/deployments%2Fportfolio%2Fdocker-compose.yml/raw\?ref=main
  script:
    - docker compose -f /opt/docker-compose.yml down || true
    - docker compose -f /opt/docker-compose.yml up -d
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == "master" && $CI_PROJECT_ID == "1"

# --- Security checks -------------------------------------------------------------------------------
# They run on every master pipeline (informational: a finding does not block the deploy) and on a
# weekly scheduled pipeline (CI/CD > Schedules, target branch master), where a finding fails the
# pipeline so that the GitLab -> n8n webhook sends a FAILED notification to Discord.

dependency-audit:
  stage: scan
  image: node:lts-alpine
  script:
    # reads package-lock.json only, nothing to install; devDependencies are not shipped to production
    - npm audit --omit=dev --audit-level=high
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_PROJECT_ID == "1"
    - if: $CI_COMMIT_BRANCH == "master" && $CI_PROJECT_ID == "1"
      allow_failure: true

image-scan:
  stage: scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  # After a build the image is fresh; on a scheduled pipeline there is no build and the scan looks at the
  # image that is currently deployed on the runner's Docker host.
  needs:
    - job: build-job
      optional: true
  variables:
    TRIVY_CACHE_DIR: .trivycache
  cache:
    key: trivy-db
    paths:
      - .trivycache/
  script:
    - trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "${IMAGE_TAGGED_NAME}"
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_PROJECT_ID == "1"
    - if: $CI_COMMIT_BRANCH == "master" && $CI_PROJECT_ID == "1"
      allow_failure: true
